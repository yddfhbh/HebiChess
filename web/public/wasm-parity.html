<!doctype html><meta charset="utf-8"><title>HebiChess WASM parity</title>
<pre id="result">running</pre>
<script src="/public/engine/engine-client.js"></script><script>
(async()=>{const out=document.querySelector('#result'),q=new URLSearchParams(location.search),all=(await (await fetch('/test-data/wasm-parity-100.fen')).text()).split(/\r?\n/).filter(x=>x&&!x.startsWith('#')),depth=Number(q.get('depth')||4),start=Number(q.get('start')||0),count=Number(q.get('count')||((depth===5)?50:100)),timeout=Number(q.get('caseTimeout')||((depth===5)?30000:15000)),fresh=q.get('workerMode')==='fresh',records=[],diagnostics=[];let engine;
  const stamp=(step,extra={})=>diagnostics.push({step,elapsedMs:performance.now(),...extra}); stamp('page loaded');
  const makeEngine=async()=>{engine=new HebiChessEngineClient();engine.onDiagnostic(x=>diagnostics.push(x));await engine.initialize();stamp('worker ready');}; await makeEngine();
  for(let index=start;index<Math.min(start+count,all.length);index++){if(fresh&&index>start){engine.terminate();await makeEngine();}const fen=all[index];let score=null,completedDepth=0,lastUciLine=null,lastWorkerMessage=null;engine.onInfo(({line})=>{lastUciLine=line;const m=line.match(/^info depth (\d+) score (cp|mate) (-?\d+)/);if(m){completedDepth=Number(m[1]);score=m[2]==='cp'?Number(m[3]):`mate ${m[3]}`;}});const oldReceive=engine.worker.onmessage;engine.worker.onmessage=e=>{lastWorkerMessage=e.data;oldReceive(e)};engine.position({fen});stamp('position sent',{index,fen});const started=performance.now();stamp(`go depth ${depth} sent`,{index});let bestmove;try{bestmove=await Promise.race([engine.go({depth}),new Promise((_,reject)=>setTimeout(()=>reject(Error('case timeout')),timeout))]);}catch(error){records.push({depth,index,fen,status:'timeout',error:String(error),lastUciLine,lastWorkerMessage,wallMs:performance.now()-started});out.textContent=JSON.stringify({ok:false,records,diagnostics});throw error;}records.push({depth,index,fen,status:'ok',bestmove,score,completedDepth,wallMs:performance.now()-started});stamp('case completed',{index,bestmove,wallMs:performance.now()-started});}engine.terminate();out.textContent=JSON.stringify({ok:true,depth,start,count:records.length,records,diagnostics});})().catch(error=>{if(!document.querySelector('#result').textContent.startsWith('{'))document.querySelector('#result').textContent=JSON.stringify({ok:false,error:String(error.stack||error)})});
</script>
