<!doctype html><meta charset="utf-8"><title>HebiChess WASM NNUE raw parity</title>
<pre id="result">running</pre><script src="/public/engine/engine-client.js"></script><script>
function normalizeFen(fen){const fields=String(fen).trim().split(/\s+/);if(fields.length===4)return `${fields.join(' ')} 0 1`;if(fields.length===6)return fields.join(' ');throw Error(`FEN must have 4 canonical fields or 6 UCI fields, found ${fields.length}`);}
(async()=>{const out=document.querySelector('#result'),[fens,references]=await Promise.all([fetch('/test-data/nnue-export-parity-100.fen').then(r=>r.ok?r.text():Promise.reject(Error(`FEN fixture HTTP ${r.status}`))),fetch('/test-data/nnue-export-parity-100.json').then(r=>r.ok?r.json():Promise.reject(Error(`Python reference HTTP ${r.status}`)))]),positions=fens.split(/\r?\n/).filter(x=>x&&!x.startsWith('#')),samples=references.samples;if(positions.length!==100||samples.length!==100)throw Error('need the frozen 100-FEN NNUE fixture and 100 Python references');const engine=new HebiChessEngineClient();try{await engine.initialize();await engine.loadNnue();await engine.setEvalMode('NNUE');const records=[];for(let i=0;i<100;i++){if(samples[i].fen!==positions[i])throw Error(`reference FEN mismatch at ${i}`);const normalizedFen=normalizeFen(positions[i]),actual=await engine.rawNnueEvaluate(normalizedFen),expected=Number(samples[i].raw_cp);if(!Number.isFinite(actual)||!Number.isFinite(expected))throw Error(`non-finite NNUE parity value at sample ${i}\noriginal fixture FEN: ${positions[i]}\nnormalized FEN: ${normalizedFen}\nexpected Python value: ${samples[i].raw_cp}`);const difference=Math.abs(actual-expected);if(!Number.isFinite(difference))throw Error(`non-finite NNUE parity difference at sample ${i}`);records.push({fen:positions[i],difference});}const values=records.map(x=>x.difference).sort((a,b)=>a-b),worst=records.reduce((a,b)=>a.difference>=b.difference?a:b),mean=values.reduce((a,b)=>a+b,0)/100,median=(values[49]+values[50])/2;if(![worst.difference,mean,median].every(Number.isFinite))throw Error('NNUE parity summary contains a non-finite value');const summary={samples:100,max_abs_cp_diff:worst.difference,mean_abs_cp_diff:mean,median_abs_cp_diff:median,worst_fen:worst.fen,threshold:'max_abs_cp_diff < 0.001',nnueState:engine.nnueState,evalMode:engine.evalMode};summary.ok=summary.max_abs_cp_diff<.001;out.textContent=JSON.stringify(summary,null,2);}finally{engine.terminate();}})().catch(error=>document.querySelector('#result').textContent=JSON.stringify({ok:false,error:String(error.stack||error)},null,2));
</script>
