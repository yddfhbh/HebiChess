<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>JJUGLE</title><link rel="stylesheet" href="/public/style.css?v=20260909f"><link rel="stylesheet" href="/public/time-controls.css?v=20261107a"><link rel="stylesheet" href="/public/coordinates.css?v=20260909f"><link rel="stylesheet" href="/public/interaction-fixes.css?v=20260909f"><link rel="stylesheet" href="/public/drop-latency.css?v=20260909f">
</head>
<body>
<main>
  <header><div><h1>JJUGLE</h1><p>쮸글 · 공격적인 플레이를 선호하는 자체 제작 체스 엔진</p></div><span id="mode" class="badge"></span></header>
  <section id="lobby" class="lobby"><h2>JJUGLE 대국 설정</h2><div class="time-controls" aria-label="대국 시간 설정"><label for="time-preset">시간 설정</label><select id="time-preset"><option value="1+0">1+0</option><option value="1+1">1+1</option><option value="2+1">2+1</option><option value="3+0">3+0</option><option value="3+2">3+2</option><option value="5+0" selected>5+0</option><option value="5+3">5+3</option><option value="10+0">10+0</option><option value="10+5">10+5</option><option value="15+10">15+10</option><option value="30+0">30+0</option><option value="0+0">무제한</option><option value="custom">사용자 정의</option></select><span id="custom-time" hidden><input id="custom-minutes" type="number" min="0" max="180" value="5" aria-label="기본 시간(분)">분 + <input id="custom-increment" type="number" min="0" max="60" value="0" aria-label="추가 시간(초)">초</span></div><div class="lobby-actions"><button data-color="white">백으로 시작</button><button data-color="black">흑으로 시작</button><button data-color="random">랜덤</button></div></section>
  <section id="game" hidden>
    <div class="game-grid">
      <div class="board-column">
        <div id="top-card" class="player-card opponent"></div>
        <div class="board-wrap"><div id="eval-bar" aria-hidden="true"><span></span></div><div class="board-area"><div id="ranks" class="edge-coordinates ranks"></div><div id="board" aria-label="chess board"></div><div id="files" class="edge-coordinates files"></div></div></div>
        <div id="bottom-card" class="player-card user"></div>
      </div>
      <aside class="panel">
        <div class="status"><span id="status">대국 준비 중</span><span id="metrics"></span></div>
        <div class="engine-info"><span class="thinking-dot"></span><span id="engine-state">Ready</span><span id="nodes"></span></div>
        <div class="history-head"><h2>Moves</h2><span id="history-state"></span></div>
        <div id="moves" class="moves" role="list"></div>
        <div id="new-move" class="new-move" hidden>새 수가 도착했습니다 <button id="latest-small">현재 위치</button></div>
        <div class="controls"><button id="first" title="처음">|&lt;</button><button id="prev" title="이전">&lt;</button><button id="next" title="다음">&gt;</button><button id="latest" title="현재 위치">현재 위치</button></div>
        <div class="controls"><button id="flip">보드 뒤집기</button><button id="cancel-premove" hidden>프리무브 취소</button></div>
        <div class="actions"><button id="resign" class="danger">기권</button><button id="pgn">PGN 복사</button></div>
      </aside>
    </div>
  </section>
  <div id="toast" role="status"></div>
</main>
<div id="modal" class="modal" hidden><div class="modal-card"><button id="modal-close" class="modal-x">×</button><h2 id="modal-title"></h2><p id="modal-message"></p><div class="modal-actions"><button id="modal-pgn">PGN 복사</button><button id="modal-new">새 게임</button></div></div></div>
<div id="promotion-modal" class="modal" hidden><div class="modal-card promotion-card"><h2>프로모션 선택</h2><div id="promotion-choices" class="promotion-choices"></div><button id="promotion-cancel" class="promotion-cancel">취소</button></div></div>
<script src="/public/ui-helpers.js?v=20260909f"></script>
<script src="/public/state-sync.js?v=20260910r3"></script>
<script src="/public/engine/engine-client.js?v=20260922jjugle1"></script>
<script src="/public/engine/engine-telemetry.js?v=20260911r1"></script>
<script src="/public/mutation-client.js?v=20260910r3"></script>
<script src="/public/app.js?v=20260922perf1"></script>
<script src="/public/interaction-fixes.js?v=20260915a"></script>
<script src="/public/drop-latency.js?v=20260915a"></script>
</body></html>
